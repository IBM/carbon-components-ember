packages:
  - carbon-components-ember
  - carbon-components-ember-mcp
  - dom-parity
  - scripts

# Dependencies we upgrade by hand (see AGENTS.md); Dependabot ignores them.
catalogs:
  # The Carbon packages we keep in parity with; @carbon/react leads, and
  # AGENTS.md says where the others' versions come from.
  carbon:
    '@carbon/ai-chat-components': 1.11.0
    '@carbon/grid': ^11.65.0
    '@carbon/icon-helpers': ^10.84.0
    '@carbon/ibm-products': 2.101.0
    '@carbon/ibm-products-styles': 2.97.0
    '@carbon/icons': ^11.91.0
    '@carbon/layout': ^11.62.0
    '@carbon/react': 1.119.0
    '@carbon/styles': ^1.118.0
    '@carbon/themes': 11.84.0
    '@carbon/utilities': 0.28.0
  # Glint doesn't support TypeScript 7 yet; #948 tracks the upgrade.
  typescript:
    typescript: 6.0.3

allowBuilds:
  '@carbon-labs/react-resizer': false
  '@carbon/ai-chat-components': false
  '@carbon/charts': false
  '@carbon/colors': false
  '@carbon/feature-flags': false
  '@carbon/grid': false
  '@carbon/icon-helpers': false
  '@carbon/icons': false
  '@carbon/ibm-products': false
  '@carbon/ibm-products-styles': false
  '@carbon/icons-react': false
  '@carbon/react': false
  '@carbon/layout': false
  '@carbon/motion': false
  '@carbon/styles': false
  '@carbon/themes': false
  '@carbon/type': false
  '@carbon/utilities': false
  '@carbon/utilities-react': false
  '@carbon/utils-position': false
  '@carbon/web-components': false
  '@ibm/plex': false
  '@ibm/plex-mono': false
  '@ibm/plex-sans': false
  '@ibm/plex-sans-arabic': false
  '@ibm/plex-sans-devanagari': false
  '@ibm/plex-sans-hebrew': false
  '@ibm/plex-sans-thai': false
  '@ibm/plex-sans-thai-looped': false
  '@ibm/plex-serif': false
  '@parcel/watcher': false
  esbuild: true
  playwright-chromium: true
  unrs-resolver: false

autoDedupe: true

overrides:
  # Security floors for transitive dev tooling that pins a vulnerable range,
  # so no in-range update can fix it. Everything else is kept current by
  # updating within ranges; re-check `pnpm audit` before adding to this list.
  # ember-cli-babel@7 pins an old @babel/runtime.
  '@babel/runtime@<7.26.10': ^7.29.7
  compression@<1.8.2: ^1.8.2
  http-cache-semantics@<=4.2.0: ^4.3.0
  postcss-selector-parser@<7.1.6: ^7.1.6
  proxy-addr@>=1.1.0 <2.0.8: ^2.0.8
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  # Old broccoli tooling (watch-detector, can-symlink) pins tmp@0.0.x.
  tmp: ^0.2.7
  # socket.io-adapter (via testem) pins ws with a ~ range.
  ws@8: ^8.21.0

patchedDependencies:
  # Unreleased ember-storybook fixes: a build of the 0.5.1 tag with these
  # merged, diffed against the published 0.5.1 (dist/*.mjs only):
  # - CSF `subcomponents` in the docs Args table
  #   (ember-integrations/ember-storybook#81, closed; see #121)
  # - "Show code" for default-exported components uses their own signature
  #   (ember-integrations/ember-storybook#88)
  # - a components manifest for Storybook's MCP addon
  #   (ember-integrations/ember-storybook#89)
  # - the params of a block typed by reference, as one forwarding another
  #   component's block is (ember-integrations/ember-storybook#117)
  # Drop once all are released.
  ember-storybook@0.5.1: patches/ember-storybook@0.5.1.patch
  # Vite's dependency optimizer hashes every discovered dependency again each
  # time its scan finds another one, so the work grows with the square of the
  # count: minutes on CI for the ~11k @carbon/icons modules our stories import,
  # before the first bundle starts. This hashes the scanned batch once. A fix
  # is being proposed to Vite; drop this patch, and the exact `vite` pin and
  # Dependabot ignore that go with it, once a release has it (#1057).
  vite@8.3.4: patches/vite@8.3.4.patch

# Newer than pnpm's minimum release age when we moved to it; drop once it's older.
minimumReleaseAgeExclude:
  - ember-storybook@0.5.1
