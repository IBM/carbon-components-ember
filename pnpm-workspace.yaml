packages:
  - carbon-components-ember
  - dom-parity
allowBuilds:
  '@carbon/ai-chat-components': true
  '@carbon/charts': true
  '@carbon/colors': true
  '@carbon/feature-flags': true
  '@carbon/grid': true
  '@carbon/icon-helpers': true
  '@carbon/icons': true
  '@carbon/icons-react': true
  '@carbon/react': true
  '@carbon/layout': true
  '@carbon/motion': true
  '@carbon/styles': true
  '@carbon/themes': true
  '@carbon/type': true
  '@carbon/utilities': true
  '@carbon/utils-position': true
  '@carbon/web-components': true
  '@ibm/plex': true
  '@ibm/plex-mono': true
  '@ibm/plex-sans': true
  '@ibm/plex-sans-arabic': true
  '@ibm/plex-sans-devanagari': true
  '@ibm/plex-sans-hebrew': true
  '@ibm/plex-sans-thai': true
  '@ibm/plex-sans-thai-looped': true
  '@ibm/plex-serif': true
  '@parcel/watcher': true
  esbuild: true
  playwright-chromium: true
  unrs-resolver: true
overrides:
  # Every package must share one copy of @glint/template: its `Invoke` symbol
  # is unique per copy, and several addons (e.g. ember-element-helper) import
  # it in their types without declaring it, so they get the hoisted copy.
  '@glint/template': ^1.9.0
  # Security floors for transitive dev tooling that pins a vulnerable range,
  # so no in-range update can fix it. Everything else is kept current by
  # updating within ranges; re-check `pnpm audit` before adding to this list.
  # ember-cli-babel@7 pins an old @babel/runtime.
  '@babel/runtime': ^7.29.7
  # Old broccoli tooling (watch-detector, can-symlink) pins tmp@0.0.x.
  tmp: ^0.2.7
  # socket.io-adapter (via testem) pins ws with a ~ range.
  ws@8: ^8.21.0
patchedDependencies:
  # `storybook build` indexes the stories while Vite builds, so ember-storybook
  # could read an empty story list and ship no args tables or story sources.
  # The patch waits for the index first. Drop it once ember-storybook releases
  # the fix (ember-integrations/ember-storybook, fix/build-waits-for-story-index).
  ember-storybook@0.4.2: patches/ember-storybook@0.4.2.patch
