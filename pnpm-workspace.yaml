packages:
  - carbon-components-ember
  - dom-parity

allowBuilds:
  '@carbon/ai-chat-components': false
  '@carbon/charts': false
  '@carbon/colors': false
  '@carbon/feature-flags': false
  '@carbon/grid': false
  '@carbon/icon-helpers': false
  '@carbon/icons': false
  '@carbon/icons-react': false
  '@carbon/react': false
  '@carbon/layout': false
  '@carbon/motion': false
  '@carbon/styles': false
  '@carbon/themes': false
  '@carbon/type': false
  '@carbon/utilities': false
  '@carbon/utils-position': false
  '@carbon/web-components': false
  '@ibm/plex': false
  '@ibm/plex-mono': false
  '@ibm/plex-sans': false
  '@ibm/plex-sans-arabic': false
  '@ibm/plex-sans-devanagari': false
  '@ibm/plex-sans-hebrew': false
  '@ibm/plex-sans-thai': false
  '@ibm/plex-sans-thai-looped': false
  '@ibm/plex-serif': false
  '@parcel/watcher': false
  esbuild: true
  playwright-chromium: true
  unrs-resolver: false

autoDedupe: true

minimumReleaseAgeExclude:
  - ember-eslint-parser
overrides:
  # Security floors for transitive dev tooling that pins a vulnerable range,
  # so no in-range update can fix it. Everything else is kept current by
  # updating within ranges; re-check `pnpm audit` before adding to this list.
  # ember-cli-babel@7 pins an old @babel/runtime.
  '@babel/runtime': ^7.29.7
  compression@<1.8.2: ^1.8.2
  http-cache-semantics@<=4.2.0: ^4.3.0
  postcss-selector-parser@<7.1.6: ^7.1.6
  proxy-addr@>=1.1.0 <2.0.8: ^2.0.8
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  # Old broccoli tooling (watch-detector, can-symlink) pins tmp@0.0.x.
  tmp: ^0.2.7
  # socket.io-adapter (via testem) pins ws with a ~ range.
  ws@8: ^8.21.0

packageExtensions:
  # The patch below makes ember-storybook import @mdx-js/react instead of a
  # bundled copy; this declares the dependency (as its fix upstream does).
  ember-storybook@0.4.2:
    dependencies:
      '@mdx-js/react': ^3.1.0
patchedDependencies:
  # Unreleased ember-storybook fixes: a build of upstream main with these
  # merged, diffed against the published 0.4.2 (dist/*.mjs only):
  # - CSF `subcomponents` in the docs Args table
  #   (ember-integrations/ember-storybook#81)
  # - `storybook build` waits for the story index, so the docs data (args
  #   tables, "Show code") isn't empty (ember-integrations/ember-storybook#86)
  # - one @mdx-js/react shared with the MDX pages, so their code blocks,
  #   links and headings get Storybook's components
  #   (ember-integrations/ember-storybook#87)
  # - "Show code" for stories with a multi-word export name
  #   (ember-integrations/ember-storybook#78)
  # - "Show code" for stories that inherit their render from the meta or
  #   from the story they extend(), or use a helper's
  #   (ember-integrations/ember-storybook#85)
  # Drop once all are released.
  ember-storybook@0.4.2: patches/ember-storybook@0.4.2.patch
