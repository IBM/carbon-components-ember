<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- A strict CSP, as apps use: no style attributes, and <style> elements
      only with the page's nonce. See tests/helpers/csp.ts. -->
    <meta property="csp-nonce" nonce="carbon-tests" />
    <meta
      http-equiv="Content-Security-Policy"
      content="style-src-attr 'none'; style-src-elem 'self' 'nonce-carbon-tests'"
    />
    <title>carbon-components-ember Tests</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="qunit"></div>
    <div id="qunit-fixture">
      <div id="ember-testing-container">
        <div id="ember-testing"></div>
      </div>
    </div>

    <script src="/testem.js" integrity="" data-embroider-ignore vite-ignore></script>
    <script type="module">
      import "ember-testing";
    </script>

    <script type="module">
      import { start } from "./test-helper.js";
      import.meta.glob("./**/*.{js,ts,gjs,gts}", { eager: true });
      start();
    </script>
  </body>
</html>
