# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    versioning-strategy: increase
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    # pnpm (see package.json#packageManager) rejects versions published less
    # than a day ago, so don't propose them before then.
    cooldown:
      default-days: 1
    # pnpm-workspace.yaml's catalogs are upgraded by hand (see AGENTS.md).
    # This also stops security-update PRs for them; alerts still show.
    ignore:
      - dependency-name: "@carbon/ai-chat-components"
      - dependency-name: "@carbon/grid"
      - dependency-name: "@carbon/icon-helpers"
      - dependency-name: "@carbon/icons"
      - dependency-name: "@carbon/layout"
      - dependency-name: "@carbon/react"
      - dependency-name: "@carbon/styles"
      - dependency-name: "@carbon/themes"
      - dependency-name: "@carbon/utilities"
      - dependency-name: "typescript"

  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions need their own entry.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns:
          - "*"
