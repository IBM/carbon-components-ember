# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    versioning-strategy: increase
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    # pnpm (see package.json#packageManager) rejects versions published less
    # than a day ago, so don't propose them before then.
    cooldown:
      default-days: 1
    # Dependabot's own labels, which these replace, plus release-plan's.
    labels:
      - "dependencies"
      - "javascript"
      - "internal"
    # pnpm-workspace.yaml's catalogs are upgraded by hand (see AGENTS.md).
    # This also stops security-update PRs for them; alerts still show.
    ignore:
      - dependency-name: "@carbon/ai-chat-components"
      - dependency-name: "@carbon/grid"
      - dependency-name: "@carbon/ibm-products"
      - dependency-name: "@carbon/ibm-products-styles"
      - dependency-name: "@carbon/icon-helpers"
      - dependency-name: "@carbon/icons"
      - dependency-name: "@carbon/layout"
      - dependency-name: "@carbon/react"
      - dependency-name: "@carbon/styles"
      - dependency-name: "@carbon/themes"
      - dependency-name: "@carbon/utilities"
      - dependency-name: "typescript"
      # Pinned for patches/vite@8.3.4.patch until a Vite release has the fix (#1057).
      - dependency-name: "vite"
      # AI Chat's Markdown follows @carbon/ai-chat-components, which is on
      # markdown-it 14; take a major when it does.
      - dependency-name: "markdown-it"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/markdown-it"
        update-types: ["version-update:semver-major"]
    # One PR for each kind of update instead of one per package. Majors
    # stay apart, as they're the ones that need code changes.
    groups:
      npm:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions need their own entry.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    labels:
      - "dependencies"
      - "github_actions"
      - "internal"
    groups:
      github-actions:
        patterns:
          - "*"
