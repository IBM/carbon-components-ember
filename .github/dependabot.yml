# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    versioning-strategy: increase
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    # pnpm (see package.json#packageManager) rejects versions published less
    # than a day ago, so don't propose them before then.
    cooldown:
      default-days: 1

  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions need their own entry.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns:
          - "*"
