name: Docs

# The documentation site is the Storybook: every story is also a browser
# test. Kept apart from CI so it can be re-run on its own.
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - v*

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read # finds main's story screenshots
    outputs:
      addon: ${{ steps.changes.outputs.addon }}
      packages: ${{ steps.changes.outputs.packages }}
      screenshots-run: ${{ steps.screenshots.outputs.run }}
      screenshots-sha: ${{ steps.screenshots.outputs.sha }}
      screenshots-stale: ${{ steps.screenshots.outputs.stale }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: changes
        uses: ./.github/actions/changes

      # The story screenshots a branch's are compared with: those of main's
      # run for the commit the branch starts from, once it finishes, or the
      # newest finished one before it. If this fails, nothing is compared.
      - id: screenshots
        if: github.ref_type == 'branch' && github.ref != 'refs/heads/main' && steps.changes.outputs.addon == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(git merge-base origin/main HEAD)
          # A branch rebased right after a merge starts while main's run for
          # that commit is still going. An older run's screenshots would be stale.
          pending=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/docs.yml/runs?branch=main&head_sha=$base" \
            --jq '.workflow_runs[0] // empty | select(.status != "completed") | .id') || true
          if [[ -n $pending ]]; then
            echo "Waiting for main's run at $base (run $pending)"
            timeout 15m gh run watch "$pending" -R "$GITHUB_REPOSITORY" -i 15 > /dev/null || true
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=story-screenshots-1&per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.head_branch == "main" and (.expired | not)) | "\(.workflow_run.head_sha) \(.workflow_run.id)"')
          for sha in $(git rev-list --first-parent --max-count=100 "$base"); do
            run=$(awk -v sha="$sha" '$1 == sha { print $2; exit }' <<< "$runs")
            [[ -n $run ]] || continue
            # A run still going may not have every shard's yet.
            [[ $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status) == completed ]] || continue
            echo "Comparing story screenshots with main's at $sha (run $run)"
            {
              echo "run=$run"
              echo "sha=$sha"
              # Main has changed what renders since: differences may be main's own.
              git diff --quiet "$sha" "$base" -- carbon-components-ember package.json pnpm-lock.yaml pnpm-workspace.yaml patches ||
                echo "stale=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "::notice::No story screenshots from main to compare with"

  # Every story (and its tests) renders in Chromium through Vitest. Most of
  # the time goes on booting Ember once per story file, so the files are
  # split across shards.
  stories:
    name: Stories (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.addon == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # downloads main's story screenshots
      pull-requests: read # reads the PR's labels
    strategy:
      fail-fast: false
      matrix:
        # The number of shards is the length of this list. Within a shard,
        # Vitest already runs files in parallel on the runner's cores.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          # See the same step's comment in the `test` job above.
          pnpm --filter carbon-components-ember exec playwright install chromium
          pnpm --filter carbon-components-ember generate

      - name: Download main's story screenshots
        if: needs.changes.outputs.screenshots-run
        uses: actions/download-artifact@v8
        with:
          pattern: story-screenshots-*
          merge-multiple: true
          path: carbon-components-ember/__screenshots__
          run-id: ${{ needs.changes.outputs.screenshots-run }}
          github-token: ${{ github.token }}

      # Each story is compared with its screenshot from main (see
      # .storybook/vitest.setup.ts), and a difference fails it, unless the
      # PR has the `preview` label, for visual changes: then the Docs job
      # lists the differences on the PR. Main takes the screenshots afresh.
      - name: Test stories
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ needs.changes.outputs.screenshots-stale }}
        run: |
          args=(--shard=${{ matrix.shard }}/${{ strategy.job-total }})
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            args+=(--update)
          elif [[ $STALE == true ]] ||
            gh pr list --head "$GITHUB_REF_NAME" --json labels --jq '.[].labels[].name' | grep -qx preview; then
            export STORY_SCREENSHOTS=report
          fi
          pnpm --filter carbon-components-ember test:storybook "${args[@]}"

      - name: Upload the story screenshots
        if: github.ref == 'refs/heads/main' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: story-screenshots-${{ matrix.shard }}
          path: carbon-components-ember/__screenshots__
          overwrite: true
          retention-days: 30

      # Vitest writes the actual and diff images of each story that differs;
      # put main's screenshot next to them.
      - name: Add main's screenshots of the stories that differ
        if: github.ref != 'refs/heads/main' && !cancelled()
        working-directory: carbon-components-ember
        run: |
          shopt -s globstar nullglob
          for actual in .vitest/attachments/src/**/*-actual-chromium-linux.png; do
            story=$(basename "$(dirname "$actual")")/$(basename "$actual" -actual-chromium-linux.png)
            cp "__screenshots__/$story-chromium-linux.png" "${actual%-actual-chromium-linux.png}-reference-chromium-linux.png" || true
          done

      - name: Upload the screenshots that differ
        if: github.ref != 'refs/heads/main' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: story-screenshot-diffs-${{ matrix.shard }}
          path: carbon-components-ember/.vitest/attachments/src
          include-hidden-files: true
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

  build-storybook:
    name: Build Storybook
    needs: changes
    if: needs.changes.outputs.addon == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter carbon-components-ember generate

      - name: Build Storybook
        run: pnpm build:storybook

      # Which Carbon React stories this build matches, and what changed from
      # main's, in the job summary. Informational, so a network hiccup
      # doesn't fail the build.
      - name: Story parity
        continue-on-error: true
        run: >-
          node scripts/story-parity.mjs --summary
          --ember carbon-components-ember/storybook-static/index.json
          --baseline https://ibm.github.io/carbon-components-ember/versions/main/index.json

      # Packing the addon writes its agent skill's references from this
      # build; fail here, not at release, if the manifest stops fitting.
      - name: Write the skill's component references
        run: pnpm --filter carbon-components-ember generate:skill-references

      # The deploy below publishes this build rather than building again.
      - name: Upload the site
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: carbon-components-ember/storybook-static
          retention-days: 1

  # The documentation site is the Storybook. This is the one check to
  # require for it, whatever the number of shards: the story tests pass and
  # the site builds.
  docs:
    name: Docs
    needs: [changes, stories, build-storybook]
    # Run (and fail) when a needed job failed, rather than being skipped:
    # a skipped required check counts as passing.
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      contents: write # pushes the screenshots that differ to story-screenshots
      pull-requests: write # comments with the stories whose screenshots differ
    steps:
      - name: Download the screenshots that differ
        if: needs.changes.outputs.screenshots-run
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: story-screenshot-diffs-*
          merge-multiple: true
          path: diffs

      - name: Find the branch's pull request
        id: pr
        if: needs.changes.outputs.screenshots-run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f head="$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" \
            --jq '.[0] // empty | "number=\(.number)\npreview=\(any(.labels[]; .name == "preview"))"' >> "$GITHUB_OUTPUT"

      # On a branch of their own, not gh-pages, so they don't rebuild the site.
      # Under the commit, so GitHub's image cache never shows an earlier
      # commit's.
      - name: Publish the screenshots that differ
        id: publish
        if: steps.pr.outputs.number && hashFiles('diffs/**/*-actual-chromium-linux.png')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          shopt -s globstar nullglob
          git init -q "$RUNNER_TEMP/screenshots"
          cd "$RUNNER_TEMP/screenshots"
          git config user.name 'Patrick Pircher'
          git config user.email 'patricklx@users.noreply.github.com'
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          for i in 1 2 3 4 5; do
            # The branch holds one commit; the lease is on it, or on there being
            # no branch yet.
            BASE=
            if git fetch -q --depth 1 origin story-screenshots 2> /dev/null; then
              BASE=$(git rev-parse FETCH_HEAD)
              git checkout -q -f "$BASE"
              git clean -fdq
            fi
            # Replaces the PR's earlier screenshots.
            rm -rf "pr-$PR"
            dir="pr-$PR/$GITHUB_SHA"
            mkdir -p "$dir"
            for actual in "$GITHUB_WORKSPACE"/diffs/**/*-actual-chromium-linux.png; do
              base=${actual%-actual-chromium-linux.png}
              id=$(basename "$(dirname "$actual")")--$(basename "$base")
              for kind in actual diff reference; do
                if [[ -f $base-$kind-chromium-linux.png ]]; then
                  cp "$base-$kind-chromium-linux.png" "$dir/$id-$kind.png"
                fi
              done
            done
            git add -A .
            COMMIT=$(git commit-tree "$(git write-tree)" -m "Story screenshots for PR #$PR ($GITHUB_SHA)")
            if git push -q --force-with-lease=story-screenshots:"$BASE" origin "$COMMIT:refs/heads/story-screenshots"; then
              exit 0
            fi
            echo "Push rejected (attempt $i), retrying against the latest story-screenshots..."
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push story-screenshots after retries"
          exit 1

      # In the job summary and in a comment on the PR, kept up to date. Not
      # part of the check, so a hiccup in either step doesn't fail it.
      - name: List the stories whose screenshots differ
        if: needs.changes.outputs.screenshots-run
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          BASELINE: ${{ needs.changes.outputs.screenshots-sha }}
          PR: ${{ steps.pr.outputs.number }}
          PREVIEW: ${{ steps.pr.outputs.preview }}
          PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          STALE: ${{ needs.changes.outputs.screenshots-stale }}
          STORIES: ${{ needs.stories.result }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { owner, repo } = context.repo;
            const site = 'https://ibm.github.io/carbon-components-ember';
            const marker = '<!-- story-screenshots -->';
            const pr = process.env.PR;
            const preview = process.env.PREVIEW === 'true';
            const published = process.env.PUBLISHED === 'true';
            const images = `https://raw.githubusercontent.com/${owner}/${repo}/story-screenshots/pr-${pr}/${context.sha}`;

            // diffs/**/<component>/<story>-actual-chromium-linux.png, with
            // -diff and -reference beside it when main has the story.
            const suffix = '-actual-chromium-linux.png';
            const stories = fs.existsSync('diffs')
              ? fs
                  .readdirSync('diffs', { recursive: true })
                  .filter((file) => file.endsWith(suffix))
                  .map((file) => {
                    const base = path.join('diffs', file.slice(0, -suffix.length));
                    const [component, story] = file.split(path.sep).slice(-2);
                    const has = (kind) => fs.existsSync(`${base}-${kind}-chromium-linux.png`);
                    return {
                      id: `${component}--${story.slice(0, -suffix.length)}`,
                      diff: has('diff'),
                      reference: has('reference'),
                    };
                  })
                  .sort((a, b) => a.id.localeCompare(b.id))
              : [];

            const links = (id) =>
              `[${id}](${site}/versions/main/?path=/story/${id})` +
              (preview ? ` → [this PR](${site}/pr-previews/pr-${pr}/?path=/story/${id})` : '');
            // Collapsed, so a PR with many differences stays readable.
            const expanded = ({ id, diff, reference }) => {
              const full = [
                reference && `[main's](${images}/${id}-reference.png)`,
                `[this branch's](${images}/${id}-actual.png)`,
              ].filter(Boolean);
              const shown = diff ? `${id}-diff.png` : `${id}-actual.png`;
              return [
                `<details><summary>${id}</summary>`,
                '',
                `${links(id)} · full size: ${full.join(', ')}`,
                '',
                `![${diff ? 'What changed' : "This branch's screenshot"}](${images}/${shown})`,
                '',
                '</details>',
              ].join('\n');
            };
            // GitHub refuses a comment over 65,536 characters: past a budget,
            // stories get just their links, then only a count.
            const entries = [];
            let length = 0;
            for (const story of stories) {
              const plain = `- ${links(story.id)}`;
              const full = published && length < 40_000 ? expanded(story) : plain;
              if (length + full.length > 60_000) {
                entries.push(`- and ${stories.length - entries.length} more, in the run's artifacts`);
                break;
              }
              entries.push(full);
              length += full.length + 1;
            }
            const baseline = process.env.BASELINE.slice(0, 7);

            let body;
            if (stories.length) {
              body = [
                `At ${context.sha.slice(0, 7)}, these stories' screenshots differ from main's (${baseline}):`,
                '',
                ...entries,
                '',
                published
                  ? `Expand a story to see what changed. The images are also in the [run's artifacts](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}#artifacts).`
                  : `Their reference, actual and diff images are in the [run's artifacts](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}#artifacts).`,
                process.env.STALE
                  ? "Main has changed since, so some may be main's own; they don't fail the Docs check."
                  : !preview
                    ? 'They fail the Docs check. If the changes are intended, add the `preview` label and re-run the failed jobs.'
                    : process.env.STORIES === 'success'
                      ? "The PR has the `preview` label, so they don't fail the Docs check."
                      : 'The PR has the `preview` label now, so re-run the failed jobs.',
              ].join('\n');
            } else {
              body = `At ${context.sha.slice(0, 7)}, no story screenshots differ from main's (${baseline}).`;
            }
            await core.summary.addRaw(body).write();
            if (!pr) return;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            body = `${marker}\n### Story screenshots\n\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else if (stories.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }

      - name: Check the story tests and the Storybook build
        run: |
          echo "Stories: ${{ needs.stories.result }}"
          echo "Build Storybook: ${{ needs.build-storybook.result }}"
          test "${{ needs.changes.result }}" = success
          # Both are skipped when the addon didn't change.
          for result in "${{ needs.stories.result }}" "${{ needs.build-storybook.result }}"; do
            [[ $result == success || $result == skipped ]] || exit 1
          done

  # Publishes the site for this version at versions/<version>/ on gh-pages.
  deploy:
    name: Deploy
    needs: docs
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    permissions:
      contents: write # pushes the built docs to gh-pages
      actions: write # starts the Pages deploy
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: site/version
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: gh-pages
          path: gh-pages
      - id: push
        run: |-
          cd $GITHUB_WORKSPACE/gh-pages
          git config --global user.name 'Patrick Pircher'
          git config --global user.email 'patricklx@users.noreply.github.com'
          VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          for i in 1 2 3 4 5; do
            # Replace the version's folder, so no files from an earlier
            # deploy (e.g. the old docs-app site) are left behind.
            rm -rf versions/$VERSION
            mkdir -p versions
            cp -r $GITHUB_WORKSPACE/site/version versions/$VERSION
            git add -A .
            if git diff --staged --quiet; then
              echo "No changes to deploy"
              exit 0
            fi
            # gh-pages only ever holds one commit: build an orphan commit from the
            # staged tree and force-push it, leased on the tip we started from so a
            # concurrent deploy is never overwritten (we retry on top of it instead).
            BASE=$(git rev-parse HEAD)
            COMMIT=$(git commit-tree "$(git write-tree)" -m 'docs')
            if git push --force-with-lease=gh-pages:"$BASE" origin "$COMMIT:refs/heads/gh-pages"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $i), retrying against latest gh-pages..."
            git fetch origin gh-pages
            git reset --hard FETCH_HEAD
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push to gh-pages after retries"
          exit 1

      # Pages deploys from main only, and this push starts no workflow.
      - name: Deploy the site
        if: steps.push.outputs.pushed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main



