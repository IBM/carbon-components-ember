name: Test, Build & Publish

on:
  workflow_dispatch:
  push:
    branches: "**"
    tags:
      - v*

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # docs-app's build depends on kolay, which uses RegExp.escape (Node >= 24)
          node-version: 24

      - name: install pnpm
        run: npm i -g pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: pnpm install, build, and test
        run: |
          pnpm install
          # pnpm's side-effects cache can skip playwright-chromium's install script on a store cache hit, even though the browsers it downloads live outside the store and don't persist across runners.
          pnpm --filter test-app exec playwright install chromium
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)
          pnpm run lint
          pnpm run build
          pnpm run test
        env:
          CI: true

  ember-try:
    name: ember-try (${{ matrix.scenario }})
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix:
        experimental: [false]
        scenario:
          - release
        include:
          - scenario: beta
            experimental: true
          - scenario: canary
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: install pnpm
        run: npm i -g pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies (pnpm)
        run: |-
          pnpm install
          # See the same step's comment in the `test` job above.
          pnpm --filter test-app exec playwright install chromium
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)
      #      - name: Setup ember-try scenario
      #        working-directory: ./test-app
      #        run: ./node_modules/.bin/ember try:one ember-${{ matrix.scenario }} --skip-cleanup --- cat package.json
      - name: Build V2 addon
        working-directory: ./carbon-components-ember
        run: pnpm run build
      - name: Run test
        working-directory: ./test-app
        run: pnpm run test:ember

  deploy:
    needs: [test, ember-try]
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # docs-app's build depends on kolay, which uses RegExp.escape (Node >= 24)
          node-version: 24
      - run: |-
          npm i -g pnpm
          pnpm i
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)
      - if: github.ref == 'refs/heads/main'
        run: |-
          DOCS_URL=versions/main pnpm run build
          mkdir -p ./docs-app/gh-pages/versions/main
          cp -r ./docs-app/dist/* ./docs-app/gh-pages/versions/main
      - if: github.ref_type == 'tag'
        run: |-
          DOCS_URL=versions/$GITHUB_REF_NAME pnpm run build
          mkdir -p ./docs-app/gh-pages/versions/$GITHUB_REF_NAME
          cp -r ./docs-app/dist/* ./docs-app/gh-pages/versions/$GITHUB_REF_NAME
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: gh-pages
          path: gh-pages
      - run: |-
          cd $GITHUB_WORKSPACE/gh-pages
          git config --global user.name 'Patrick Pircher'
          git config --global user.email 'patricklx@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            cp -r $GITHUB_WORKSPACE/docs-app/gh-pages/versions/* versions/
            git add .
            if git diff --staged --quiet; then
              echo "No changes to deploy"
              exit 0
            fi
            # gh-pages only ever holds one commit: build an orphan commit from the
            # staged tree and force-push it, leased on the tip we started from so a
            # concurrent deploy is never overwritten (we retry on top of it instead).
            BASE=$(git rev-parse HEAD)
            COMMIT=$(git commit-tree "$(git write-tree)" -m 'docs')
            if git push --force-with-lease=gh-pages:"$BASE" origin "$COMMIT:refs/heads/gh-pages"; then
              exit 0
            fi
            echo "Push rejected (attempt $i), retrying against latest gh-pages..."
            git fetch origin gh-pages
            git reset --hard FETCH_HEAD
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push to gh-pages after retries"
          exit 1



