name: Test, Build & Publish

on:
  workflow_dispatch:
  push:
    branches: "**"
    tags:
      - v*

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)

      - name: Lint
        run: pnpm run lint

  test:
    name: Test
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          # pnpm's side-effects cache can skip playwright-chromium's install script on a store cache hit, even though the browsers it downloads live outside the store and don't persist across runners.
          pnpm --filter carbon-components-ember exec playwright install chromium
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)

      - name: Run tests
        run: pnpm run test
        env:
          CI: true

      # For the try-scenarios job
      - id: set-matrix
        working-directory: ./carbon-components-ember
        run: |
          echo "matrix=$(pnpm --reporter=silent dlx @embroider/try list)" >> $GITHUB_OUTPUT

  # Every story (and its tests) renders in Chromium through Vitest. Most of
  # the time goes on booting Ember once per story file, so the files are
  # split across shards.
  stories:
    name: Stories (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The number of shards is the length of this list. Within a shard,
        # Vitest already runs files in parallel on the runner's cores.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          # See the same step's comment in the `test` job above.
          pnpm --filter carbon-components-ember exec playwright install chromium
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)

      - name: Test stories
        working-directory: ./carbon-components-ember
        run: pnpm test:storybook --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)

      - name: Build Storybook
        working-directory: ./carbon-components-ember
        run: pnpm build-storybook

  # The documentation site is the Storybook. This is the one check to
  # require for it, whatever the number of shards: the story tests pass and
  # the site builds.
  docs:
    name: Docs
    needs: [stories, build-storybook]
    # Run (and fail) when a needed job failed, rather than being skipped:
    # a skipped required check counts as passing.
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check the story tests and the Storybook build
        run: |
          echo "Stories: ${{ needs.stories.result }}"
          echo "Build Storybook: ${{ needs.build-storybook.result }}"
          test "${{ needs.stories.result }}" = success
          test "${{ needs.build-storybook.result }}" = success

  try-scenarios:
    name: ${{ matrix.name }}
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.allowedToFail == true }}
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Apply scenario
        working-directory: ./carbon-components-ember
        run: pnpm dlx @embroider/try apply ${{ matrix.name }}

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          # See the same step's comment in the `test` job above.
          pnpm --filter carbon-components-ember exec playwright install chromium
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)

      - name: Run tests
        working-directory: ./carbon-components-ember
        run: pnpm test
        env: ${{ matrix.env }}

  deploy:
    needs: [lint, test, docs, try-scenarios]
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    permissions:
      contents: write # pushes the built docs to gh-pages
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - run: |-
          pnpm install --frozen-lockfile
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)
      # The site for this version is the Storybook, at versions/<version>/.
      - name: Build Storybook
        run: |-
          (cd ./carbon-components-ember && pnpm build-storybook)
          mkdir -p ./site
          cp -r ./carbon-components-ember/storybook-static ./site/version
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: gh-pages
          path: gh-pages
      - run: |-
          cd $GITHUB_WORKSPACE/gh-pages
          git config --global user.name 'Patrick Pircher'
          git config --global user.email 'patricklx@users.noreply.github.com'
          VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          for i in 1 2 3 4 5; do
            # Replace the version's folder, so no files from an earlier
            # deploy (e.g. the old docs-app site) are left behind.
            rm -rf versions/$VERSION
            mkdir -p versions
            cp -r $GITHUB_WORKSPACE/site/version versions/$VERSION
            git add -A .
            if git diff --staged --quiet; then
              echo "No changes to deploy"
              exit 0
            fi
            # gh-pages only ever holds one commit: build an orphan commit from the
            # staged tree and force-push it, leased on the tip we started from so a
            # concurrent deploy is never overwritten (we retry on top of it instead).
            BASE=$(git rev-parse HEAD)
            COMMIT=$(git commit-tree "$(git write-tree)" -m 'docs')
            if git push --force-with-lease=gh-pages:"$BASE" origin "$COMMIT:refs/heads/gh-pages"; then
              exit 0
            fi
            echo "Push rejected (attempt $i), retrying against latest gh-pages..."
            git fetch origin gh-pages
            git reset --hard FETCH_HEAD
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push to gh-pages after retries"
          exit 1



