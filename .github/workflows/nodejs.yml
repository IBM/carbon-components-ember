name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - v*

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    outputs:
      addon: ${{ steps.changes.outputs.addon }}
      packages: ${{ steps.changes.outputs.packages }}
      skills: ${{ steps.changes.outputs.skills }}
      markdown: ${{ steps.changes.outputs.markdown }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: changes
        uses: ./.github/actions/changes

  skills:
    name: Agent skills
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # The specification's own validator, pinned with hashes. It reads only
      # SKILL.md and the folder's name, so this covers the packed skill too.
      - name: Validate against the Agent Skills specification
        run: |
          python3 -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install --quiet --disable-pip-version-check \
            --require-hashes --no-deps --only-binary :all: \
            -r .github/skills-ref-requirements.txt
          status=0
          for skill in carbon-components-ember/skills/*/ .claude/skills/*/; do
            "$RUNNER_TEMP/skills-ref/bin/agentskills" validate "$skill" || status=1
          done
          exit $status

  markdown:
    name: Markdown
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      # markdownlint-cli2 is a root dependency, so skip the packages.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter .

      - name: Lint Markdown
        run: pnpm lint:md

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.packages != ''
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter carbon-components-ember generate

      - name: Lint
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          status=0
          for p in $PACKAGES; do pnpm --filter "$p" lint || status=1; done
          exit $status

      - name: Compare arguments with Carbon React
        if: ${{ !cancelled() && needs.changes.outputs.addon == 'true' }}
        run: pnpm --filter dom-parity args --check

      - name: Test dom-parity
        if: ${{ !cancelled() && contains(needs.changes.outputs.packages, 'dom-parity') }}
        run: pnpm --filter dom-parity test

  mcp:
    name: MCP server
    needs: changes
    if: contains(needs.changes.outputs.packages, 'carbon-components-ember-mcp')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter carbon-components-ember-mcp

      - name: Test
        run: pnpm --filter carbon-components-ember-mcp test

  scripts:
    name: Scripts
    needs: changes
    if: contains(needs.changes.outputs.packages, 'scripts')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter scripts

      - name: Test
        run: pnpm --filter scripts test

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.addon == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          # pnpm's side-effects cache can skip playwright-chromium's install script on a store cache hit, even though the browsers it downloads live outside the store and don't persist across runners.
          pnpm --filter carbon-components-ember exec playwright install chromium
          pnpm --filter carbon-components-ember generate

      - name: Run tests
        run: pnpm run test
        env:
          CI: true

  # Lists the try-scenarios matrix in its own job, so the scenarios run
  # alongside the Test job instead of after it.
  scenarios:
    name: Scenarios
    needs: changes
    if: needs.changes.outputs.addon == 'true'
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          cache: false

      - id: set-matrix
        working-directory: ./carbon-components-ember
        run: |
          echo "matrix=$(pnpm --reporter=silent dlx @embroider/try list)" >> $GITHUB_OUTPUT

  try-scenarios:
    name: ${{ matrix.name }}
    needs: scenarios
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.allowedToFail == true }}
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.scenarios.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Apply scenario
        working-directory: ./carbon-components-ember
        run: pnpm dlx @embroider/try apply ${{ matrix.name }}

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          # See the same step's comment in the `test` job above.
          pnpm --filter carbon-components-ember exec playwright install chromium
          pnpm --filter carbon-components-ember generate

      - name: Run tests
        run: pnpm test
        env: ${{ matrix.env }}
