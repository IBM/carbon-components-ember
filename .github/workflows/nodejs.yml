name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - v*

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    outputs:
      addon: ${{ steps.changes.outputs.addon }}
      packages: ${{ steps.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: changes
        uses: ./.github/actions/changes

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.packages != ''
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter carbon-components-ember create-autogenerated-files

      - name: Lint
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          status=0
          for p in $PACKAGES; do pnpm --filter "$p" lint || status=1; done
          exit $status

      - name: Compare arguments with Carbon React
        if: ${{ !cancelled() && needs.changes.outputs.addon == 'true' }}
        run: pnpm --filter dom-parity args --check

      - name: Test dom-parity
        if: ${{ !cancelled() && contains(needs.changes.outputs.packages, 'dom-parity') }}
        run: pnpm --filter dom-parity test

  mcp:
    name: MCP server
    needs: changes
    if: contains(needs.changes.outputs.packages, 'carbon-components-ember-mcp')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter carbon-components-ember-mcp

      - name: Test
        run: pnpm --filter carbon-components-ember-mcp test

  scripts:
    name: Scripts
    needs: changes
    if: contains(needs.changes.outputs.packages, 'scripts')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter scripts

      - name: Test
        run: pnpm --filter scripts test

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.addon == 'true'
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          # pnpm's side-effects cache can skip playwright-chromium's install script on a store cache hit, even though the browsers it downloads live outside the store and don't persist across runners.
          pnpm --filter carbon-components-ember exec playwright install chromium
          pnpm --filter carbon-components-ember create-autogenerated-files

      - name: Run tests
        run: pnpm run test
        env:
          CI: true

      # For the try-scenarios job
      - id: set-matrix
        working-directory: ./carbon-components-ember
        run: |
          echo "matrix=$(pnpm --reporter=silent dlx @embroider/try list)" >> $GITHUB_OUTPUT

  try-scenarios:
    name: ${{ matrix.name }}
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.allowedToFail == true }}
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Apply scenario
        working-directory: ./carbon-components-ember
        run: pnpm dlx @embroider/try apply ${{ matrix.name }}

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          # See the same step's comment in the `test` job above.
          pnpm --filter carbon-components-ember exec playwright install chromium
          pnpm --filter carbon-components-ember create-autogenerated-files

      - name: Run tests
        run: pnpm test
        env: ${{ matrix.env }}
