name: Test, Build & Publish

on:
  workflow_dispatch:
  push:
    branches: "**"
    tags:
      - v*

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # Node 24 (docs-app's kolay needs RegExp.escape) + the pinned pnpm
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)

      - name: Lint
        run: pnpm run lint

  test:
    name: Test
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      # Node 24 (docs-app's kolay needs RegExp.escape) + the pinned pnpm
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          # pnpm's side-effects cache can skip playwright-chromium's install script on a store cache hit, even though the browsers it downloads live outside the store and don't persist across runners.
          pnpm --filter carbon-components-ember exec playwright install chromium
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)

      - name: Run tests
        run: pnpm run test
        env:
          CI: true

      # For the try-scenarios job
      - id: set-matrix
        working-directory: ./carbon-components-ember
        run: |
          echo "matrix=$(pnpm --reporter=silent dlx @embroider/try list)" >> $GITHUB_OUTPUT

  docs:
    name: Docs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # Node 24 (docs-app's kolay needs RegExp.escape) + the pinned pnpm
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)

      - name: Build addon and docs
        run: pnpm run build

  storybook:
    name: Storybook
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # Node 24 (docs-app's kolay needs RegExp.escape) + the pinned pnpm
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          # See the same step's comment in the `test` job above.
          pnpm --filter carbon-components-ember exec playwright install chromium
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)

      # Every story (and its tests) rendered in Chromium through Vitest.
      - name: Test stories
        working-directory: ./carbon-components-ember
        run: pnpm test:storybook

      - name: Build Storybook
        working-directory: ./carbon-components-ember
        run: pnpm build-storybook

  try-scenarios:
    name: ${{ matrix.name }}
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.allowedToFail == true }}
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24 (docs-app's kolay needs RegExp.escape) + the pinned pnpm
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Apply scenario
        working-directory: ./carbon-components-ember
        run: pnpm dlx @embroider/try apply ${{ matrix.name }}

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          # See the same step's comment in the `test` job above.
          pnpm --filter carbon-components-ember exec playwright install chromium
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)

      - name: Run tests
        working-directory: ./carbon-components-ember
        run: pnpm test
        env: ${{ matrix.env }}

  deploy:
    needs: [lint, test, docs, storybook, try-scenarios]
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    permissions:
      contents: write # pushes the built docs to gh-pages
    steps:
      - uses: actions/checkout@v7

      # Node 24 (docs-app's kolay needs RegExp.escape) + the pinned pnpm
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - run: |-
          pnpm install --frozen-lockfile
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)
      - if: github.ref == 'refs/heads/main'
        run: |-
          DOCS_URL=versions/main pnpm run build
          mkdir -p ./docs-app/gh-pages/versions/main
          cp -r ./docs-app/dist/* ./docs-app/gh-pages/versions/main
      - if: github.ref_type == 'tag'
        run: |-
          DOCS_URL=versions/$GITHUB_REF_NAME pnpm run build
          mkdir -p ./docs-app/gh-pages/versions/$GITHUB_REF_NAME
          cp -r ./docs-app/dist/* ./docs-app/gh-pages/versions/$GITHUB_REF_NAME
      # Storybook is published next to each docs version, at <version>/storybook/.
      - name: Build Storybook
        run: |-
          VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          (cd ./carbon-components-ember && pnpm build-storybook)
          rm -rf ./docs-app/gh-pages/versions/$VERSION/storybook
          cp -r ./carbon-components-ember/storybook-static ./docs-app/gh-pages/versions/$VERSION/storybook
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: gh-pages
          path: gh-pages
      - run: |-
          cd $GITHUB_WORKSPACE/gh-pages
          git config --global user.name 'Patrick Pircher'
          git config --global user.email 'patricklx@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            cp -r $GITHUB_WORKSPACE/docs-app/gh-pages/versions/* versions/
            git add .
            if git diff --staged --quiet; then
              echo "No changes to deploy"
              exit 0
            fi
            # gh-pages only ever holds one commit: build an orphan commit from the
            # staged tree and force-push it, leased on the tip we started from so a
            # concurrent deploy is never overwritten (we retry on top of it instead).
            BASE=$(git rev-parse HEAD)
            COMMIT=$(git commit-tree "$(git write-tree)" -m 'docs')
            if git push --force-with-lease=gh-pages:"$BASE" origin "$COMMIT:refs/heads/gh-pages"; then
              exit 0
            fi
            echo "Push rejected (attempt $i), retrying against latest gh-pages..."
            git fetch origin gh-pages
            git reset --hard FETCH_HEAD
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push to gh-pages after retries"
          exit 1



