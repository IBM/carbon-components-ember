name: PR Docs Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

jobs:
  deploy-preview:
    name: Deploy Preview
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
      (contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) && contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # Node 24 (docs-app's kolay needs RegExp.escape) + the pinned pnpm
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          (cd ./carbon-components-ember && pnpm create-autogenerated-files)

      - name: Build docs-app
        run: DOCS_URL=pr-previews/pr-${{ github.event.pull_request.number }} pnpm run build

      - name: Build Storybook
        working-directory: ./carbon-components-ember
        run: pnpm build-storybook

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: gh-pages
          path: gh-pages

      - name: Deploy to gh-pages
        run: |
          cd $GITHUB_WORKSPACE/gh-pages
          git config --global user.name 'Patrick Pircher'
          git config --global user.email 'patricklx@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            rm -rf pr-previews/pr-${{ github.event.pull_request.number }}
            mkdir -p pr-previews/pr-${{ github.event.pull_request.number }}
            cp -r $GITHUB_WORKSPACE/docs-app/dist/* pr-previews/pr-${{ github.event.pull_request.number }}/
            cp -r $GITHUB_WORKSPACE/carbon-components-ember/storybook-static pr-previews/pr-${{ github.event.pull_request.number }}/storybook
            git add .
            if git diff --staged --quiet; then
              echo "No changes to deploy"
              exit 0
            fi
            # gh-pages only ever holds one commit: build an orphan commit from the
            # staged tree and force-push it, leased on the tip we started from so a
            # concurrent deploy is never overwritten (we retry on top of it instead).
            BASE=$(git rev-parse HEAD)
            COMMIT=$(git commit-tree "$(git write-tree)" -m "Deploy docs preview for PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }})")
            if git push --force-with-lease=gh-pages:"$BASE" origin "$COMMIT:refs/heads/gh-pages"; then
              exit 0
            fi
            echo "Push rejected (attempt $i), retrying against latest gh-pages..."
            git fetch origin gh-pages
            git reset --hard FETCH_HEAD
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push to gh-pages after retries"
          exit 1

      - name: Post or update preview comment
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- pr-docs-preview -->';
            const body = `${marker}
            ## 📖 Docs Preview

            🔗 **Preview URL:** https://ibm.github.io/carbon-components-ember/pr-previews/pr-${{ github.event.pull_request.number }}/
            📚 **Storybook:** https://ibm.github.io/carbon-components-ember/pr-previews/pr-${{ github.event.pull_request.number }}/storybook/

            _Built from commit ${{ github.event.pull_request.head.sha }}_`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ github.event.pull_request.number }},
                body,
              });
            }

  cleanup-preview:
    name: Cleanup Preview
    if: |
      (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview')) ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: gh-pages
          path: gh-pages

      - name: Remove preview from gh-pages
        run: |
          cd $GITHUB_WORKSPACE/gh-pages
          if [ -d "pr-previews/pr-${{ github.event.pull_request.number }}" ]; then
            git config --global user.name 'Patrick Pircher'
            git config --global user.email 'patricklx@users.noreply.github.com'
            for i in 1 2 3 4 5; do
              if [ ! -d "pr-previews/pr-${{ github.event.pull_request.number }}" ]; then
                echo "Preview already removed"
                exit 0
              fi
              git rm -rf pr-previews/pr-${{ github.event.pull_request.number }}
              # gh-pages only ever holds one commit: build an orphan commit from the
              # staged tree and force-push it, leased on the tip we started from so a
              # concurrent deploy is never overwritten (we retry on top of it instead).
              BASE=$(git rev-parse HEAD)
              COMMIT=$(git commit-tree "$(git write-tree)" -m "Remove docs preview for PR #${{ github.event.pull_request.number }}")
              if git push --force-with-lease=gh-pages:"$BASE" origin "$COMMIT:refs/heads/gh-pages"; then
                exit 0
              fi
              echo "Push rejected (attempt $i), retrying against latest gh-pages..."
              git fetch origin gh-pages
              git reset --hard FETCH_HEAD
              sleep $((RANDOM % 5 + 1))
            done
            echo "Failed to push to gh-pages after retries"
            exit 1
          fi

      - name: Update preview comment
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- pr-docs-preview -->';
            const body = `${marker}
            ## 📖 Docs Preview

            ~~Preview has been removed~~ (PR closed or \`preview\` label removed).`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }
